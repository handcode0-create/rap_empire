server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  etag on;

  # Point d'entrée, code et manifestes : toujours revalidés (sinon un téléphone garde l'ancienne version du jeu).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Fichiers d'un build : leur adresse change à chaque déploiement (/b/<date>/), ils peuvent donc être gardés longtemps.
  location ^~ /b/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Images, données et code : revalidation à chaque chargement (réponse 304 rapide si rien n'a changé).
  location ~* \.(?:js|mjs|css|json|png|jpg|jpeg|gif|svg|webp|ico|wasm|bin|frag)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Polices : stables, cache long.
  location ~* \.(?:woff2?|ttf|otf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }
}
