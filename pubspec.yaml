name: rap_empire
description: RAP EMPIRE — simulateur de carrière de rappeur (handCode Studio). Monde 100 % fictif.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/characters/
    - assets/characters/rapper_001/
    - assets/characters/rapper_001/young/
    - assets/characters/rapper_001/mature/
    - assets/scenes/
    - assets/svg/
    - assets/klipo/
    - assets/klipo/thumbs/
    - assets/klipo/mine/
    - assets/klipo/crowd/
    - assets/patrimoine/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 800
