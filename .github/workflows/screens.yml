name: Captures des écrans web

on:
  push:
    branches:
      - feat/v21-project-release-workflow
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'web/**'
      - 'tool/screens/**'
      - '.github/workflows/screens.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - run: python tool/screens/shoot.py build/web shots
      - name: Droits d'auteur (avis animé, détail, rendez-vous, instrus, fiche du titre)
        run: |
          python tool/screens/make_litige.py /tmp/lit
          SHOT_ROUTES="litige-avis=/droits,instru=/studio/instru,titre-droits=/studio/catalogue/titre,journal-litige=/journal" python tool/screens/shoot.py build/web shots /tmp/lit/litige_avis.json
          SHOT_ROUTES="litige-detail=/droits,qg-litige=/" python tool/screens/shoot.py build/web shots /tmp/lit/litige_detail.json
          SHOT_ROUTES="litige-rdv=/droits/rendez-vous" python tool/screens/shoot.py build/web shots /tmp/lit/litige_rdv.json
          SHOT_ENGINE=webkit SHOT_ROUTES="litige-avis=/droits" python tool/screens/shoot.py build/web shots /tmp/lit/litige_avis.json || echo 'WebKit indisponible'
      - name: Mêmes écrans avec le moteur de Safari (WebKit)
        run: SHOT_ENGINE=webkit python tool/screens/shoot.py build/web shots || echo 'WebKit indisponible'
      - name: Publier les captures sur la branche ci-screens
        run: |
          sha=$(git rev-parse --short HEAD)
          mkdir -p /tmp/pub && cp shots/*.png /tmp/pub/
          cd /tmp/pub
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "captures web de $sha"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
