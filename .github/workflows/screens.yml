name: Captures des écrans web

on:
  push:
    branches:
      - feat/v21-project-release-workflow
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'web/**'
      - 'tool/screens/**'
      - '.github/workflows/screens.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python tool/screens/shoot.py build/web shots
      - name: Publier les captures sur la branche ci-screens
        run: |
          sha=$(git rev-parse --short HEAD)
          mkdir -p /tmp/pub && cp shots/*.png /tmp/pub/
          cd /tmp/pub
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "captures web de $sha"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
