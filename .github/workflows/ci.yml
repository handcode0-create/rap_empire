name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: flutter analyze
        run: |
          set +e
          flutter analyze --no-pub > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          grep -E '^ *(error|warning|info) •' analyze.txt | while IFS= read -r l; do
            lvl=$(echo "$l" | sed -E 's/^ *(error|warning|info) .*/\1/'); loc=$(echo "$l" | awk -F' • ' '{print $3}'); msg=$(echo "$l" | awk -F' • ' '{print $2 " (" $4 ")"}')
            f=${loc%%:*}; rest=${loc#*:}; ln=${rest%%:*}
            [ "$lvl" = error ] && t=error || t=warning
            echo "::$t file=$f,line=$ln::$msg"
          done
          exit $status
      - name: flutter test
        if: ${{ !cancelled() }}
        run: flutter test --reporter expanded --file-reporter json:tests.json
      - name: résumé des tests en échec
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          import json
          names, out = {}, {}
          for line in open('tests.json'):
              try: e = json.loads(line)
              except Exception: continue
              if e.get('type') == 'testStart': names[e['test']['id']] = (e['test']['name'], e['test'].get('url') or '')
              if e.get('type') == 'error': out.setdefault(e['testID'], []).append(e.get('error', '')[:400])
              if e.get('type') == 'testDone' and e.get('result') != 'success' and not e.get('hidden'):
                  n, u = names.get(e['testID'], ('?', ''))
                  msg = ' | '.join(out.get(e['testID'], []))[:600].replace('\n', ' ')
                  print('::error title=Test en échec::' + n + ' @ ' + u.split('/')[-1] + ' :: ' + msg)
          PY
      - run: flutter build web --release
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: flutter build apk --debug
