name: Generate v21 character illustrations

on:
  push:
    branches:
      - feat/v21-project-release-workflow
    paths:
      - 'tools/design/cast.py'
      - 'tools/design/chars.py'
      - 'tools/design/chars2.py'
      - 'tools/design/export_assets.py'
      - 'tools/design/used_combos.json'
      - '.github/workflows/generate-v21-character-assets.yml'

permissions:
  contents: write

concurrency:
  group: v21-character-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current v21 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate character and scene SVGs
        run: python tools/design/export_assets.py
      - name: Commit generated assets to their asset directories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters assets/scenes
          if git diff --cached --quiet; then
            echo "Les illustrations sont déjà à jour."
            exit 0
          fi
          git commit -m "assets: régénérer les illustrations 2D du cast v21"
          git push origin HEAD:${{ github.ref_name }}
