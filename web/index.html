<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RAP EMPIRE — jeu mobile de carrière musicale dans l’univers fictif de Bakoma.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RAP EMPIRE">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14102B">
  <title>RAP EMPIRE</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #14102B; color: #fff; font-family: Arial, sans-serif; }
    #boot-status { min-height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    #boot-card { max-width: 420px; }
    #boot-title { font-size: 32px; font-weight: 800; letter-spacing: 1px; }
    #boot-message { color: #c9c4d8; line-height: 1.5; margin-top: 16px; }
    #boot-error { display: none; margin-top: 16px; padding: 12px; border: 1px solid #8f4b77; border-radius: 10px; color: #ffd5ec; text-align: left; overflow-wrap: anywhere; font-size: 13px; }
    #boot-status.is-error #boot-error { display: block; }
    #boot-status.is-error #boot-message { color: #ffd5ec; }
    .boot-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ec4899; margin: 20px 4px 0; animation: pulse 1s infinite alternate; }
    @keyframes pulse { to { opacity: .25; } }
  </style>
</head>
<body>
  <div id="boot-status" role="status" aria-live="polite">
    <div id="boot-card">
      <div id="boot-title">RAP EMPIRE</div>
      <div id="boot-message">Initialisation du jeu…</div>
      <div id="boot-dots"><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span></div>
      <div id="boot-error"></div>
    </div>
  </div>
  <script>
    (function () {
      var panel = document.getElementById('boot-status');
      var message = document.getElementById('boot-message');
      var detail = document.getElementById('boot-error');
      var finished = false, t0 = Date.now(), logs = [];
      function note(kind, args) {
        var line = kind + ' ' + Array.prototype.map.call(args, function (a) { try { return a && a.stack ? a.stack : (typeof a === 'string' ? a : JSON.stringify(a)); } catch (e) { return String(a); } }).join(' ');
        logs.push(((Date.now() - t0) / 1000).toFixed(1) + 's ' + line.slice(0, 400)); if (logs.length > 25) logs.shift();
        return line;
      }
      ['log', 'warn', 'error'].forEach(function (k) {
        var orig = console[k];
        console[k] = function () {
          var line = note(k.toUpperCase(), arguments);
          if (k === 'error' || /Uncaught|Exception|Error:|FLUTTER_ERROR|ZONE_ERROR/.test(line)) showError('Erreur pendant le démarrage du jeu.', line);
          return orig.apply(console, arguments);
        };
      });
      function resources() {
        try {
          return performance.getEntriesByType('resource').filter(function (r) { return /\.(js|wasm|json|bin|ttf|otf)(\?|$)/.test(r.name); })
            .map(function (r) { return r.name.split('/').slice(-2).join('/') + ' · ' + Math.round(r.duration) + ' ms' + (r.transferSize ? ' · ' + Math.round(r.transferSize / 1024) + ' Ko' : ''); }).join('\n');
        } catch (e) { return ''; }
      }
      function showError(title, error) {
        if (finished) return;
        panel.classList.add('is-error');
        message.textContent = title;
        detail.style.whiteSpace = 'pre-wrap';
        detail.textContent = (error ? String(error).slice(0, 900) : 'Aucun détail JavaScript disponible.')
          + '\n\n— Journal —\n' + logs.join('\n') + '\n\n— Fichiers chargés —\n' + resources() + '\n\n' + navigator.userAgent;
        document.getElementById('boot-dots').style.display = 'none';
      }
      // Anciennes versions : retirer le service worker et ses caches, qui servaient du code et des images périmés.
      try {
        if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      } catch (e) {}
      window.addEventListener('flutter-first-frame', function () { finished = true; panel.style.display = 'none'; });
      window.addEventListener('error', function (event) {
        var source = event.filename ? ' (' + event.filename.split('/').pop() + (event.lineno ? ':' + event.lineno : '') + ')' : '';
        showError('Erreur pendant le démarrage du jeu.', (event.message || 'Erreur JavaScript') + source);
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason && (event.reason.stack || event.reason.message) || event.reason;
        showError('Le jeu a rencontré une erreur non traitée.', reason || 'Promesse rejetée sans détail.');
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
